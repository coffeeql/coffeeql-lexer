name: Endboss PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Rust files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.rs$' > changed_files.txt || true
          echo "Changed files:"
          cat changed_files.txt || echo "(none)"

      - name: Check if review needed
        id: needed
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No .rs files changed — skipping Endboss"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Ollama binary
        if: steps.needed.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ollama
          key: ollama-binary-v1

      - name: Cache Ollama model
        if: steps.needed.outputs.skip == 'false'
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-model-qwen2.5-coder-1.5b-v1

      - name: Install Ollama
        if: steps.needed.outputs.skip == 'false'
        run: |
          if [ ! -f /usr/local/bin/ollama ]; then
            curl -fsSL https://ollama.ai/install.sh | sh
          fi
          ollama serve > /dev/null 2>&1 &
          sleep 5

      - name: Pull model (if not cached)
        if: |
          steps.needed.outputs.skip == 'false' &&
          steps.cache-model.outputs.cache-hit != 'true'
        run: ollama pull qwen2.5-coder:1.5b

      - name: Build diff for review
        if: steps.needed.outputs.skip == 'false'
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.rs' > review_diff.txt
          echo "Diff size: $(wc -l < review_diff.txt) lines"

      - name: Run Endboss Review
        if: steps.needed.outputs.skip == 'false'
        id: review
        run: |
          DIFF=$(cat review_diff.txt | head -200)
          PROMPT='You are "The Endboss" — a hyper-strict, zero-tolerance Principal Software Architect. Do not be encouraging. Start directly with flaws.

          RULES:
          1. NO POLITE FILLER. No "Nice job", "Looks good". Start with flaws immediately.
          2. ZERO TRUST. Assume edge cases are missing and tech debt was introduced.
          3. FORMAT. Exact line-by-line annotations. State the line, the problem, the mandatory fix.
          4. RUST SPECIFIC:
             - Flag every unwrap() without a justification comment
             - Flag every expect() without a justification comment
             - Flag every missing error propagation
             - Flag any unsafe block without a SAFETY comment
             - Flag logic that will panic at runtime
             - Flag missing tests for new public functions
             - Flag any clone() that could be avoided
          5. ZERO TOLERANCE ON:
             - Dead code
             - Commented-out code
             - TODOs without a linked issue number
             - Public functions without doc comments
             - Functions longer than 40 lines without justification
             - Magic numbers without named constants
          6. VERDICT — final line only:
             REJECT / CONDITIONAL MERGE / MERGE

          CODE DIFF TO REVIEW:
          '"$DIFF"

          RESPONSE=$(echo "$PROMPT" | ollama run qwen2.5-coder:1.5b 2>/dev/null)
          echo "REVIEW<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Save for comment step
          echo "$RESPONSE" > review_output.txt
          cat review_output.txt

      - name: Post review as PR comment
        if: steps.needed.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_output.txt', 'utf8');
            const body = `## ☕ Endboss Review\n\n\`\`\`\n${review}\n\`\`\`\n\n*Reviewed by The Endboss — qwen2.5-coder:1.5b*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
